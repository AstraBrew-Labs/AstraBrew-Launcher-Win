name: 发布 Win

# 触发：Cargo.toml 变化（含版本号与 `[package.metadata.astrabrew] beta` 开关）时自动发版，
# 也可手动触发。构建渠道由 Cargo.toml 的 beta 开关决定（beta → 测试版，否则 → 正式版）。
on:
  push:
    branches:
      - master
      - main
    paths:
      - Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建并发布 Windows 版本
    runs-on: windows-2022

    env:
      APP_NAME: "AstraBrew Launcher"

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 读取版本号与构建渠道
        id: metadata
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?ms)^\[package\][^\[]*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw '无法从 Cargo.toml 读取 [package].version'
          }
          $version = $match.Groups[1].Value

          # 构建渠道由 `[package.metadata.astrabrew] beta` 决定；
          # 注意：不能放进 [package.metadata.packager]，cargo-packager 会拒绝未知字段。
          $betaRaw = [regex]::Match(
            $cargo,
            '(?ms)^\[package\.metadata\.astrabrew\][^\[]*?^\s*beta\s*=\s*([^\r\n#]+)'
          ).Groups[1].Value.Trim().ToLowerInvariant()
          $isBeta = $betaRaw -eq 'true'

          $tagPrefix = if ($isBeta) { 'beta-v' } else { 'v' }
          $notes = if ($isBeta) { '测试版本发布' } else { '新版本发布' }
          $title = if ($isBeta) { "AstraBrew Launcher $version Beta" } else { "AstraBrew Launcher $version" }

          # 仅当版本号真的变化时才发版，避免改个无关字段就打出重复 Release。
          $shouldRelease = $true
          if ($env:EVENT_NAME -eq 'push' -and $env:BEFORE_SHA -and $env:BEFORE_SHA -notmatch '^0+$') {
            $previousCargo = & git show "${env:BEFORE_SHA}:Cargo.toml" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $previousMatch = [regex]::Match(
                ($previousCargo -join "`n"),
                '(?ms)^\[package\][^\[]*?^version\s*=\s*"([^"]+)"'
              )
              if ($previousMatch.Success -and $previousMatch.Groups[1].Value -eq $version) {
                $shouldRelease = $false
              }
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tagPrefix$version" >> $env:GITHUB_OUTPUT
          "channel=$(if ($isBeta) { 'beta' } else { 'release' })" >> $env:GITHUB_OUTPUT
          "notes=$notes" >> $env:GITHUB_OUTPUT
          "title=$title" >> $env:GITHUB_OUTPUT
          "should_release=$($shouldRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: 版本号未变化则跳过
        if: steps.metadata.outputs.should_release != 'true'
        shell: pwsh
        run: Write-Host 'Cargo.toml 有改动，但 [package].version 未变化，无需发版。'

      - name: 安装 Rust 工具链
        if: steps.metadata.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: 缓存 Rust 构建产物
        if: steps.metadata.outputs.should_release == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: 安装 NSIS 与 cargo-packager
        if: steps.metadata.outputs.should_release == 'true'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          cargo install cargo-packager --locked

      - name: 构建并打包
        if: steps.metadata.outputs.should_release == 'true'
        shell: pwsh
        env:
          ASTRA_BUILD_CHANNEL: ${{ steps.metadata.outputs.channel }}
        run: .\build.ps1 -Clean

      - name: 生成 SHA-256 校验文件
        if: steps.metadata.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllLines(
            (Join-Path $PWD 'dist\SHA256SUMS.txt'),
            $lines,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: 上传构建产物
        if: steps.metadata.outputs.should_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AstraBrew-Launcher-${{ steps.metadata.outputs.version }}
          path: dist/*
          if-no-files-found: error

      - name: 发布 GitHub Release
        if: steps.metadata.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # 测试版也保持非 pre-release：GitHub 的 `releases/latest` 只解析非 pre-release，
          # 而自动更新的直连源依赖 `releases/latest/download/latest.json`。
          prerelease: false
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: ${{ steps.metadata.outputs.title }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
